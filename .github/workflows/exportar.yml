name: Exportar eventos (.ics y JSON)

on:
  schedule:
    - cron: '17 */3 * * *'   # cada 3 horas
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['eventos.js', 'herramientas/exportar.mjs']

permissions:
  contents: write

jobs:
  exportar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node herramientas/exportar.mjs
      - name: Guardar si ha cambiado algo (sin contar la marca de tiempo)
        run: |
          if git diff --quiet -I '"generado"' -I '^DTSTAMP' -- eventos.json eventos.ics; then
            echo "Sin cambios"; git checkout -- eventos.json eventos.ics; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add eventos.json eventos.ics
          git commit -m "data: export events $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
